syntax = "proto3";
package alldesk;

message Envelope {
  uint32 sequence = 1;
  oneof payload {
    VideoFrame video_frame = 10;
    AudioFrame audio_frame = 11;
    MouseEvent mouse_event = 20;
    KeyEvent key_event = 21;
    ClipboardEvent clipboard_event = 30;
    FileTransferMessage file_message = 40;
    WhiteboardEvent whiteboard_event = 50;
    ControlMessage control = 60;
  }
}

message VideoFrame {
  bytes data = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool keyframe = 4;
  uint64 timestamp_ms = 5;
  uint32 monitor_id = 6;
}

message AudioFrame {
  bytes data = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
  uint64 timestamp_ms = 4;
}

message MouseEvent {
  int32 x = 1;
  int32 y = 2;
  int32 delta_x = 3;
  int32 delta_y = 4;
  MouseButton button = 5;
  ButtonState state = 6;
  MouseEventType type = 7;
}

enum MouseButton {
  MOUSE_BUTTON_NONE = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
}

enum ButtonState {
  BUTTON_STATE_RELEASED = 0;
  BUTTON_STATE_PRESSED = 1;
}

enum MouseEventType {
  MOUSE_TYPE_MOVE = 0;
  MOUSE_TYPE_CLICK = 1;
  MOUSE_TYPE_SCROLL = 2;
}

message KeyEvent {
  uint32 key_code = 1;
  uint32 scan_code = 2;
  bool pressed = 3;
  uint32 modifiers = 4;
}

message ClipboardEvent {
  ClipboardContentType content_type = 1;
  bytes data = 2;
  string text = 3;
}

enum ClipboardContentType {
  CLIPBOARD_TEXT = 0;
  CLIPBOARD_IMAGE = 1;
  CLIPBOARD_FILES = 2;
}

message FileTransferMessage {
  oneof msg {
    FileTransferRequest request = 1;
    FileTransferResponse response = 2;
    FileChunk chunk = 3;
    FileAck ack = 4;
    FileComplete complete = 5;
  }
}

message FileTransferRequest {
  string path = 1;
  uint64 offset = 2;
  uint32 chunk_size = 3;
  bool is_upload = 4;
}

message FileTransferResponse {
  bool accept = 1;
  uint64 total_size = 2;
}

message FileChunk {
  uint32 sequence = 1;
  bytes data = 2;
  uint64 offset = 3;
}

message FileAck {
  uint64 last_received_offset = 1;
}

message FileComplete {
  bytes checksum = 1;
}

message WhiteboardEvent {
  oneof event {
    WhiteboardStrokeStart stroke_start = 1;
    WhiteboardStrokePoint stroke_point = 2;
    WhiteboardStrokeEnd stroke_end = 3;
    WhiteboardClear clear = 4;
  }
}

message WhiteboardStrokeStart {
  string stroke_id = 1;
  uint32 color_r = 2;
  uint32 color_g = 3;
  uint32 color_b = 4;
  double width = 5;
  double start_x = 6;
  double start_y = 7;
}

message WhiteboardStrokePoint {
  string stroke_id = 1;
  double x = 2;
  double y = 3;
}

message WhiteboardStrokeEnd {
  string stroke_id = 1;
}

message WhiteboardClear {}

message ControlMessage {
  oneof msg {
    ControlConnect connect = 1;
    ControlDisconnect disconnect = 2;
    ControlSwitchMonitor switch_monitor = 3;
    ControlRequestKeyframe request_keyframe = 4;
  }
}

message ControlConnect {
  string peer_id = 1;
  string password = 2;
}

message ControlDisconnect {
  string reason = 1;
}

message ControlSwitchMonitor {
  uint32 monitor_id = 1;
}

message ControlRequestKeyframe {}
