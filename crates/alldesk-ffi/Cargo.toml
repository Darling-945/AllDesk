[package]
name = "alldesk-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "alldesk_ffi"
# rlib lets integration tests link the crate; the cdylib is what Flutter loads.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
alldesk-core = { path = "../alldesk-core" }
alldesk-capture = { path = "../alldesk-capture" }
alldesk-codec = { path = "../alldesk-codec" }
alldesk-platform = { path = "../alldesk-platform" }
alldesk-net = { path = "../alldesk-net" }
quinn = { workspace = true }
alldesk-files = { path = "../alldesk-files" }
alldesk-recording = { path = "../alldesk-recording" }
flutter_rust_bridge = "=2.12.0"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hostname = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Display bounds + backing pixel size for the input pixel->point adapter.
core-graphics = "0.24"
